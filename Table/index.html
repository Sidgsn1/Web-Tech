<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellspacing="5">
        <caption>List of student</caption>
        <tr>
            <th>Sno</th>
            <th>Name</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Sid</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Adi</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Ram</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Shub</td>
        </tr>
    </table>
    
    <h1>Table using row span and col span</h1>
    <table border="1" cellpadding="10" cellspacing="4">
        <caption>using rowspan and colspan</caption>
        <thead>
            <tr>
                <th>class</th>
                <th>section</th>
                <th>name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="5">II</td>
                <td rowspan="3">A</td>
                <td>Rahul</td>
            </tr>
            <tr>
                <td>Rahul</td>
            </tr>
            <tr>
                <td>Rahul</td>
            </tr>
            <tr>
                <td rowspan="2">B</td>
                <td>Rahul</td>
            </tr>
            <tr>
                <td>Rahul</td>
            </tr>
        </tbody>
    </table>

    <h1>Nested Tables</h1>
    <table border="1" cellspacing="4" cellpadding="10">
        <caption>Nested table</caption>
       <tr>
            <td rowspan="3">1</td>
            <td colspan="3">3</td>
       </tr>
       <tr>
            <td>5</td>
            <td colspan="2">
                <table border="1">
                    <tr>
                        <td>sno</td>
                        <td>name</td>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td>Ramesh</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Karan</td>
                    </tr>
                </table>
            </td>
       </tr>
       <tr>
            <td colspan="2">4</td>
       </tr>
    </table>
</body>
</html>
